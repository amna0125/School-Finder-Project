version: 2

models:
  - name: school_card
    description: "One wide row per school (762). The finder filters and scores these rows in the browser."
    columns:
      - name: school_id
        tests: [unique, not_null]
      - name: teachers
        description: "Share of teachers with a teaching degree, percent."
        tests:
          - value_between: {arguments: {min: 0, max: 100}}
      - name: pass9
        tests:
          - value_between: {arguments: {min: 0, max: 100}}
      - name: merit9
        tests:
          - value_between: {arguments: {min: 0, max: 340}}
      - name: parents_satisfied_pct
        tests:
          - value_between: {arguments: {min: 0, max: 100}}
  - name: fct_school_metrics
    description: "One row per school and metric: the latest value (with one-year fallback), its school year, status and the county median."
    tests:
      - unique_combination: {arguments: {columns: ['school_id', 'metric_key']}}
    columns:
      - name: school_id
        tests:
          - relationships: {arguments: {to: ref('school_card'), field: school_id}}
      - name: period
        description: "Every value carries the school year it describes."
        tests: [not_null]
      - name: value_status
        tests: [not_null]
  - name: fct_metric_history
    tests:
      - unique_combination: {arguments: {columns: ['school_id', 'metric_key', 'period']}}
  - name: school_approach
    description: "Reviewed approach claims with their quotes. A claim is what the school says, not verified practice."
    tests:
      - unique_combination: {arguments: {columns: ['school_id', 'category', 'subcategory']}}
    columns:
      - name: category
        tests:
          - relationships: {arguments: {to: ref('approach_categories'), field: category}}
      - name: coding_level
        tests:
          - accepted_values: {arguments: {values: ['E', 'S']}}
      - name: quoted_text
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: school_id
        tests:
          - relationships: {arguments: {to: ref('school_card'), field: school_id}}
  - name: school_survey
    tests:
      - unique_combination: {arguments: {columns: ['school_id', 'respondent_group', 'theme_key']}}
    columns:
      - name: positive_pct
        tests:
          - value_between: {arguments: {min: 0, max: 100}}
  - name: school_setting
    tests:
      - unique_combination: {arguments: {columns: ['school_id', 'feature']}}
  - name: dim_metrics
    columns:
      - name: metric_key
        tests: [unique, not_null]
